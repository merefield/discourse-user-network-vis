en:
  user_network_vis:
    queries:
      snapshot:
        name: "User network: graph snapshot"
        description: "Edges and weighted scores from the hourly cached graph, including its trust-level and activity filters. Username accepts SQL patterns (% means all users). Source and target follow the graph's stored convention, not a consistent actor/recipient direction. Empty until the graph job runs; isolated nodes are not included."
      new_user_interactions:
        name: "User network: concentrated new-user interactions"
        description: "Review candidates, not evidence of shared identity or abuse. Counts recent public likes and direct replies, without graph score or trust-level filters. Each action counts once per participant. Top counterpart percentage includes both given and received interactions; reciprocal means activity in both directions, not matching types. Small legitimate groups may appear. Lookback is capped at 365 days."
  site_settings:
    user_network_vis_enabled: "Enable the User Network Visualisation plugin"
    user_network_vis_add_menu_item: "Add a menu item to the Sidebar/Dropdown menu for the User Network Visualisation"
    user_network_vis_default_view: "Default User Network Visualisation view"
    user_network_vis_node_radius: "Size of node radii in pixels"
    user_network_vis_trust_level_0_color: "Node colour for trust level 0 users"
    user_network_vis_trust_level_1_color: "Node colour for trust level 1 users"
    user_network_vis_trust_level_2_color: "Node colour for trust level 2 users"
    user_network_vis_trust_level_3_color: "Node colour for trust level 3 users"
    user_network_vis_trust_level_4_color: "Node colour for trust level 4 users"
    user_network_vis_node_charge_strength: "Level of repulsion between nodes.  Make it larger to spread nodes out"
    user_network_vis_minimum_trust_level: "Include only Users with this Minimum Trust Level (Job rerun required)"
    user_network_vis_maximum_last_seen_years: "Include only Users seen in the last X years (Job rerun required)"
    user_network_vis_reply_multiplier: "Increase to increase the significance of replies versus likes in establishing link significance (Job rerun required)"
    user_network_vis_link_score_threshold: "Minimum score considered to include a link (Job rerun required)"
